name: Build and deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: mcp-client
            context: ./client
            image: ghcr.io/bcuenot/mcp-app-mcp-client

          - service: mcp-server
            context: ./server
            image: ghcr.io/bcuenot/mcp-app-mcp-server

          - service: streamlit
            context: ./streamlit_app
            image: ghcr.io/bcuenot/mcp-app-streamlit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on OVH VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << EOF
            set -e

            cd /opt/mcp-app

            echo "Pull latest repository files"
            git pull --ff-only

            echo "Update deployed image tag"
            if grep -q '^IMAGE_TAG=' .env.prod; then
              sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/' .env.prod
            else
              echo 'IMAGE_TAG=${{ github.sha }}' >> .env.prod
            fi

            echo "Login to GHCR"
            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USER }}' --password-stdin

            echo "Validate Compose config"
            docker compose --env-file .env.prod -f compose.prod.yaml config > /tmp/mcp-app-compose-check.yml

            echo "Pull new application images"
            docker compose --env-file .env.prod -f compose.prod.yaml pull mcp-client mcp-server streamlit

            echo "Restart services with new images"
            docker compose --env-file .env.prod -f compose.prod.yaml up -d

            echo "Current containers"
            docker compose --env-file .env.prod -f compose.prod.yaml ps

            echo "Cleanup unused Docker images"
            docker image prune -f
          EOF