services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    command: start-dev
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped
    networks:
      - internal
  
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  mcp-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/mcp-realm/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      MCP_AUDIENCE: ${MCP_AUDIENCE}
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT}
    depends_on:
      - keycloak
    restart: unless-stopped
    networks:
      - internal

  mcp-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET}
      MCP_SERVER_URL: ${MCP_SERVER_URL}
      KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL}
      MCP_CLIENT_ID: ${MCP_CLIENT_ID}
      MCP_SERVER_AUDIENCE: ${MCP_SERVER_AUDIENCE}

      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      MCP_CLIENT_AUDIENCE: ${MCP_CLIENT_AUDIENCE}

      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      mcp-server:
        condition: service_started
      
    restart: unless-stopped
    networks:
      - internal

  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      MCP_CLIENT_API_URL: ${MCP_CLIENT_API_URL}
    volumes:
      - ./streamlit_app/.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    depends_on:
      - mcp-client
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge